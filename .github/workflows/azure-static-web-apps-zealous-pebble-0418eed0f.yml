name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Build dos Remotes em Paralelo
      - name: Build remotes (frontend-customers e frontend-products)
        run: |
          (npm ci --prefix frontend-customers && npm run build --prefix frontend-customers) &
          PID_CUSTOMERS=$!
          (npm ci --prefix frontend-products && npm run build --prefix frontend-products) &
          PID_PRODUCTS=$!
          wait $PID_CUSTOMERS || { echo "frontend-customers falhou"; exit 1; }
          wait $PID_PRODUCTS  || { echo "frontend-products falhou";  exit 1; }

      # 2. Copiar todo o bundle compilado dos remotes para frontend-shell/public
      - name: Copy Remotes dist into shell public
        run: |
          mkdir -p frontend-shell/public/frontend-customers
          cp -r frontend-customers/dist/* frontend-shell/public/frontend-customers/

          mkdir -p frontend-shell/public/frontend-products
          cp -r frontend-products/dist/* frontend-shell/public/frontend-products/

          echo "=== Estrutura final dos ficheiros em shell/public ==="
          find frontend-shell/public -type f | sort

      # 3. Build do Shell (o Vite automaticamente incluirá a pasta public/ no dist)
      - name: Build frontend-shell
        run: |
          npm ci --prefix frontend-shell
          npm run build --prefix frontend-shell

      # 4. Deploy da pasta pronta (frontend-shell/dist) para o Azure
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_PEBBLE_0418EED0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend-shell/dist"
          output_location: ""
          skip_app_build: true